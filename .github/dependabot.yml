# Keeps the pinned GitHub Actions (checkout, setup-java, flutter-action, ...)
# current. Dart/Flutter dependencies are deliberately NOT automated here:
# pubspec.lock is enforced in CI, so those upgrades are reviewed by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

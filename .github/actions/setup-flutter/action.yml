name: Set up Flutter
description: >
  Installs the pinned Flutter SDK (cached) and fetches dependencies exactly as
  locked in pubspec.lock. Shared by every job so the toolchain is defined once.

inputs:
  flutter-version:
    description: Exact Flutter version, e.g. 3.47.1
    required: true

runs:
  using: composite
  steps:
    - name: Install Flutter ${{ inputs.flutter-version }}
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        # Caches the SDK and the pub cache between runs.
        cache: true

    - name: Flutter version
      shell: bash
      run: flutter --version

    - name: Get dependencies (lockfile enforced)
      shell: bash
      # Fails if pubspec.yaml and pubspec.lock disagree, so CI always builds
      # exactly what was reviewed.
      run: flutter pub get --enforce-lockfile

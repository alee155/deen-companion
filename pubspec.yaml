name: deen_companion
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  logger: ^2.3.0
  equatable: ^2.0.5
  geolocator: ^13.0.1
  flutter_screenutil: ^5.9.3
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  shimmer: ^3.0.0
  flutter_compass: ^0.8.1
  geocoding: ^3.0.0
  google_fonts: ^6.2.1
  share_plus: ^10.1.2
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  google_mobile_ads: ^9.0.0
  package_info_plus: ^9.0.1
  firebase_core: ^4.13.0
  firebase_remote_config: ^6.5.6
  # firebase_core: added automatically by `flutterfire configure` — don't
  # hand-edit its version once that's run; it picks whatever's actually
  # compatible with your Firebase project setup.
  # firebase_remote_config: NOT added by flutterfire configure (it only
  # wires up firebase_core + platform config, not individual products).
  # Add it yourself with: flutter pub add firebase_remote_config
  # — this resolves the correct version against whatever firebase_core
  # ends up at, the same way `flutter pub add package_info_plus:^9.0.1`
  # avoided the share_plus/win32 conflict earlier.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/hadith_covers/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
  

flutter_launcher_icons:
  image_path: "assets/images/app_logo.png"
  android: "launcher_icon"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
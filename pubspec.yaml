name: deen_companion
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  logger: ^2.3.0
  equatable: ^2.0.5
  geolocator: ^13.0.1
  flutter_screenutil: ^5.9.3
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  shimmer: ^3.0.0
  flutter_compass: ^0.8.1
  geocoding: ^3.0.0
  share_plus: ^10.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  google_mobile_ads: ^9.0.0
  package_info_plus: ^9.0.1
  image_picker: ^1.2.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_image_compress: ^2.5.1
  camera: ^0.12.1
  crop_your_image: ^2.0.1
  flutter_timezone: ^5.1.1
  cached_network_image: ^3.4.1
  dio_smart_retry: ^7.0.1
  wakelock_plus: ^1.5.2
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/hadith_covers/
    - assets/audio/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
  

flutter_launcher_icons:
  image_path: "assets/images/deen_comp.png"
  android: "launcher_icon"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
name: deen_companion
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  logger: ^2.3.0
  equatable: ^2.0.5
  geolocator: ^13.0.1
  flutter_screenutil: ^5.9.3
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  shimmer: ^3.0.0
  flutter_compass: ^0.8.1
  geocoding: ^3.0.0
  google_fonts: ^6.2.1
  share_plus: ^10.1.2
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/hadith_covers/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
  
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# flutter_launcher_icons config — run `dart run flutter_launcher_icons`
# after changing anything here to regenerate the actual icon files.
flutter_launcher_icons:
  image_path: "assets/images/app_logo.png"
  android: "launcher_icon"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  # Not using adaptive_icon_foreground/adaptive_icon_background for now:
  # those expect a logo-only image on a transparent background with the
  # artwork kept well inside the edges, since Android masks it into a
  # circle/squircle/rounded-square depending on the launcher. Using the
  # full app_logo.png there risks a doubled-up background or clipped
  # artwork once masked. Add those two keys back once there's a
  # dedicated foreground-only asset — see the note below this block.